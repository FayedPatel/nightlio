<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282a36" />
    <!-- Nightlio ships its own theme system (Settings > Appearance), so ask
         Dark Reader not to re-darken the page: its dynamic theme strips the
         gradient-clip text on the landing hero into an unreadable ghost. -->
    <meta name="darkreader-lock" />
    <!-- iOS "Add to Home Screen" standalone app support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Nightlio" />
    <title>Nightlio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
