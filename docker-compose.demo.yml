# Nightlio DEMO stack — a self-contained instance pre-filled with fake data
# (14 markdown mood entries, 6 goals with progress, unlocked achievements)
# on the experimental PostgreSQL backend. For trying Nightlio out, demos,
# and screenshots — NEVER for production:
#   - every credential and signing secret below is baked in and public;
#   - anyone who can reach port 5000/5173 can use the instance.
#
# Usage (no .env needed):
#   docker compose -f docker-compose.demo.yml up --build
#     → UI at http://localhost:5173, API at http://localhost:5000
#   docker compose -f docker-compose.demo.yml down -v
#     → full reset (drops the demo volumes; the next `up` re-seeds)
#
# Ports: the UI/API ports match the main compose file (5173/5000), so stop
# the regular stack first. PostgreSQL is published on 127.0.0.1:5433 (not
# 5432) for local inspection:
#   psql -h 127.0.0.1 -p 5433 -U nightlio_demo nightlio_demo
#
# Everything is namespaced (project name, volumes, no container_name) so it
# never collides with a real deployment on the same host.

name: nightlio-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Baked demo credentials — see the header warning.
      - POSTGRES_DB=nightlio_demo
      - POSTGRES_USER=nightlio_demo
      - POSTGRES_PASSWORD=nightlio-demo-password
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightlio_demo -d nightlio_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot seeder: runs `nightlio-api seed-demo` against the database and
  # exits. Idempotent — an already-seeded database is a no-op with exit 0,
  # so restarting the stack (without `down -v`) still comes up. The api
  # service waits for this to complete successfully.
  seed:
    build:
      context: ./api
    image: nightlio-api:demo
    restart: "no"
    command: ["/usr/local/bin/nightlio-api", "seed-demo"]
    environment:
      - DATABASE_URL=postgres://nightlio_demo:nightlio-demo-password@postgres:5432/nightlio_demo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Production-shaped api (APP_ENV=production, real healthcheck) — except
  # for the INSECURE baked demo secrets, which exist only so the demo boots
  # with zero configuration. Do not copy this block into a real deployment.
  api:
    image: nightlio-api:demo
    restart: unless-stopped
    environment:
      - APP_ENV=production
      # INSECURE, PUBLIC, DEMO-ONLY secrets (>= 16 chars so production
      # validation passes). Never reuse these values anywhere.
      - SECRET_KEY=insecure-demo-secret-key-do-not-reuse
      - JWT_SECRET=insecure-demo-jwt-secret-do-not-reuse
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5000
      - DATABASE_URL=postgres://nightlio_demo:nightlio-demo-password@postgres:5432/nightlio_demo?sslmode=disable
      # Still needed on the Postgres backend: /app/data hosts the login
      # rate-limiter store (rate_limit.db) and the i18n disk cache.
      - DATABASE_PATH=/app/data/nightlio.db
      - PORT=5000
    volumes:
      - demo_api_data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/nightlio-api", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # The service name `api` above is load-bearing: this nginx image proxies
  # /api to http://api:5000 by default (API_URL in nginx.conf.template).
  frontend:
    build:
      context: .
    image: nightlio-frontend:demo
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo_pg_data:
  demo_api_data:
