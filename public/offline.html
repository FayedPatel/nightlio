<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282a36" />
    <title>Nightlio — Offline</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        box-sizing: border-box;
        background: #282a36;
        color: #f5f5f5;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
        color: #f5f5f5;
      }
      p {
        margin: 0 0 8px;
        color: #9ca3af;
        line-height: 1.5;
        font-size: 1rem;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        min-width: 44px;
        padding: 10px 24px;
        font-size: 1rem;
        font-weight: 600;
        color: #282a36;
        background: #bd93f9;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #a97cf3;
      }
      button:focus-visible {
        outline: 3px solid rgba(189, 147, 249, 0.6);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo.png" alt="" />
      <h1>You're offline</h1>
      <p>Nightlio is self-hosted — your entries live on your own server, not in this browser.</p>
      <p>Reconnect to your server to keep journaling.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
