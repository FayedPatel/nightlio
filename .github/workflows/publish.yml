# Build the api and frontend images and push them to GHCR under the repo
# owner's namespace (ghcr.io/<owner>/nightlio-api, .../nightlio-frontend).
#
# Publishing with the workflow's GITHUB_TOKEN links each package to this
# repository. Because the repository is private, the packages are created
# private as well — nothing becomes publicly pullable unless the package
# visibility is changed by hand in the package settings afterwards.
#
# Pulling on a server therefore needs a login first:
#   echo <PAT with read:packages> | docker login ghcr.io -u <user> --password-stdin

name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nightlio-api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: nightlio-frontend
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4

      # buildx for multi-stage builds and GHA layer caching. amd64-only:
      # every deploy target is x86. If an ARM host ever appears (Raspberry
      # Pi, Oracle ARM, Apple Silicon), add a setup-qemu-action step and
      # "linux/arm64" to platforms below.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner for the registry path
      # (FayedPatel -> fayedpatel), which GHCR requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
