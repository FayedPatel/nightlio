# Build the api and frontend images and push them to GHCR
# under the repo owner's namespace (ghcr.io/<owner>/nightlio-api,
# .../nightlio-frontend).
#
# Publishing with the workflow's GITHUB_TOKEN links each package to this
# repository. Because the repository is private, the packages are created
# private as well — nothing becomes publicly pullable unless the package
# visibility is changed by hand in the package settings afterwards.
#
# Pulling on a server therefore needs a login first:
#   echo <PAT with read:packages> | docker login ghcr.io -u <user> --password-stdin
#
# Exactly ONE build happens per commit, on the push to main. A release tag
# (v*) does NOT rebuild: the retag job re-points the semver tag at the
# sha-tagged image that the main push already built, so 0.5.0 and latest
# are the same digest. (Previously a release built twice -- once for the
# merge, once for the tag -- producing two different digests for the same
# commit and doubling the package-version count on every release.)

name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Gate publishing on the test suite passing for this exact commit. Calling
  # test.yml as a reusable workflow (it declares `workflow_call` in its
  # `on:`) gives real `needs:`-style job dependency semantics -- publishing
  # cannot start until this finishes, and it runs against the same SHA that
  # triggered this workflow. Previously publish.yml had no such gate at all:
  # a red `main` could still publish new "latest" images.
  # Branch pushes only: a tag points at a commit that already passed this
  # gate (and was built) when it landed on main, so tag pushes skip
  # straight to the retag job below.
  test:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/test.yml

  build-push:
    if: github.ref_type == 'branch'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the Rust cutover: publishing under the SAME image name
          # (nightlio-api) that used to be the Flask build means a
          # self-hoster who deploys from published images (rather than
          # `docker compose up --build`) gets the swap just by pulling the
          # new tag -- docker-compose.yml and nginx are unchanged, see
          # docs/UPGRADING.md.
          - image: nightlio-api
            context: ./api
            dockerfile: ./api/Dockerfile
          # NOTE: the legacy Python backend is removed from the repo
          # (contract/DECISIONS.md, "Legacy removal"), so no Flask image is
          # built or published. Rollback for image-based deployments means
          # running a previously published pre-v0.4.0 nightlio-api tag —
          # see docs/UPGRADING.md.
          # PDF export renders in-process via the markdown2pdf crate
          # (contract/DECISIONS.md #15) — no sidecar image to publish.
          - image: nightlio-frontend
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4

      # QEMU registers binfmt_misc handlers for foreign-arch binaries so the
      # arm64 leg below can run under emulation on this amd64 runner --
      # needed by BOTH matrix legs: nightlio-frontend's build stage runs
      # node/yarn for arm64, and nightlio-api's build stage runs `cargo
      # build --release` (plus `apt-get install build-essential`, for
      # rusqlite's bundled SQLite C sources) for arm64. See api/Dockerfile
      # for why the Rust image uses full per-platform emulation rather than
      # a cross-compiling builder (`cross`/`cargo-zigbuild`), and for the
      # local verification steps that proved this works before it was wired
      # into CI.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # buildx for multi-stage builds and GHA layer caching.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner for the registry path
      # (FayedPatel -> fayedpatel), which GHCR requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # No type=semver here: this job never runs for tag pushes any
          # more -- release versions are applied by the retag job below,
          # which re-points the tag at the sha-* image built here.
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Cargo registry + target caching for the nightlio-api (Rust) build:
      # `cache-from/cache-to: type=gha` on its own only caches finished
      # Docker LAYERS, not cargo's own registry/target dirs, so a naive
      # single-stage `COPY . . && cargo build` here would recompile every
      # dependency (rusqlite's bundled sqlite3, openidconnect's TLS stack,
      # ...) from scratch on every source change regardless of this cache
      # -- CI times would regress sharply. api/Dockerfile avoids that by
      # using cargo-chef to split the build into a deps-only layer (keyed
      # on Cargo.toml/Cargo.lock only) and a source layer: the expensive
      # `cargo chef cook` layer IS what ends up cached below, scoped per
      # matrix.image, so it survives source-only changes across builds and
      # only reinvalidates when dependencies actually change.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # linux/arm64 build for both legs runs under QEMU emulation (the
          # setup-qemu-action step above), not cross-compilation -- see
          # api/Dockerfile's top-of-file comment for why, and for how this
          # was verified locally (buildx build --platform linux/arm64 +
          # run + --health-check) before landing here. This is a real
          # multi-arch proof, not just a platforms: list edit: the arm64
          # nightlio-api image was actually built and run.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx attaches provenance attestations by default, which show
          # up in GHCR as two extra untagged "unknown/unknown" versions per
          # push. Nothing here consumes them, so drop them: each push now
          # leaves only the manifest list plus its two arch manifests.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Release tags re-point, they don't rebuild. `imagetools create` pushes a
  # new manifest list that references the blobs the main build already
  # pushed, so the semver tag is byte-identical to the sha-*/latest image
  # and a release adds zero new builds (and zero new package versions
  # beyond the tag pointer itself).
  retag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Needed only to peel the tag to its commit below.
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point release tag at the sha image built on main
        run: |
          set -euo pipefail
          # HEAD is always the peeled commit, even for annotated tags
          # (github.sha can be the tag OBJECT for those, which would never
          # match the commit-keyed sha-* tag from metadata-action).
          SHA=$(git rev-parse HEAD)
          SHORT="sha-${SHA:0:7}"           # metadata-action type=sha format
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"  # GHCR requires lowercase
          VERSION="${GITHUB_REF_NAME#v}"

          for image in nightlio-api nightlio-frontend; do
            src="ghcr.io/${OWNER}/${image}:${SHORT}"
            # The tag usually lands minutes after the merge, while the main
            # build (~20 min) is still running -- wait for its image.
            found=""
            for i in $(seq 1 30); do
              if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
                found=1
                break
              fi
              echo "waiting for ${src} (attempt ${i}/30)..."
              sleep 60
            done
            if [ -z "$found" ]; then
              echo "::error::${src} not found after 30 min. Commit ${SHA} was never built on main -- merge it first, then tag."
              exit 1
            fi
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/${image}:${VERSION}" "$src"
          done
