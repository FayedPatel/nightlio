name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # Lets publish.yml gate its build-push job on this workflow's outcome by
  # calling it as a reusable workflow (`uses: ./.github/workflows/test.yml`
  # + `needs: test`), rather than the flakier `workflow_run` trigger (which
  # runs against the workflow file on the default branch and needs manual
  # SHA/ref correlation to know what it actually tested). This does not
  # change how test.yml runs on its own pull_request/push triggers above.
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The legacy Python api job is gone with the Flask backend itself
  # (removed after real-data validation — contract/DECISIONS.md, "Legacy
  # removal"). api is the only API: unit/parity coverage in the `rust`
  # job below, end-to-end coverage in the `e2e` job via scripts/e2e-api.sh.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail fast if package.json / api/Cargo.toml / contract/openapi.yaml
      # versions have drifted apart (publish.yml gates on this workflow, so
      # a drifted version can never ship). Lives in this job because it is
      # the cheapest: plain POSIX sh, no toolchain, runs before the
      # node/yarn setup below.
      - run: sh scripts/check-version-sync.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          # Matches api/Dockerfile (rust:1.90-slim) and Cargo.toml's
          # rust-version, so a toolchain difference can never pass here and
          # fail (or vice versa) in the Docker build.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Scoped to api so this job's cache never collides with a
          # future workspace crate elsewhere in the repo.
          workspaces: api -> target
          # Same shared key as the e2e shards — see the e2e job's cache
          # step for why the default per-job keys would not be shared.
          shared-key: api-target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # PostgreSQL backend gate (v0.6.0): the exact same `cargo test` as the
  # rust job, but with NIGHTLIO_PG_TEST_URL set so the PG-gated cases
  # activate — every integration harness replays its recorded fixtures a
  # second time against a PG-backed app (template-database cloning per
  # test, see api/tests/support/mod.rs), the db/pg quirk tests run against
  # the live server, and the migrate-to-postgres round trip executes.
  # Without the variable those cases skip, which is why the rust job above
  # stays byte-identical and PG-free.
  rust-pg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        # Matches the docker-compose `postgres` profile service; PostgreSQL
        # >= 16 is a hard schema requirement (pg_input_is_valid).
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nightlio_test
          POSTGRES_USER: nightlio
          POSTGRES_PASSWORD: nightlio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightlio -d nightlio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIGHTLIO_PG_TEST_URL: postgres://nightlio:nightlio@localhost:5432/nightlio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        # Same pinned toolchain as the rust job; no clippy/rustfmt
        # components — lint gates run once, in the rust job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          # Same shared cache as the rust job and the e2e shards (their
          # step comments explain why the default per-job keys would not
          # be shared). This job compiles the same test artifacts, so a
          # warm cache makes it restore-only.
          shared-key: api-target
      - run: cargo test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # One shard failing should not cancel the others — each shard's
      # result is independently useful.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # scripts/e2e-api.sh defaults to E2E_API_BACKEND=rust, which does a
      # release `cargo build` of api/ before every run (see that
      # script). Without a toolchain here this job would fail with
      # "cargo: command not found" -- it never needed Rust before the
      # cutover because the e2e API used to boot the Flask app directly.
      # Same pinned ref as the `rust` job (its @1.90.0 IS the toolchain
      # version with this action, matching api/Dockerfile's
      # rust:1.90-slim); no clippy/rustfmt components needed here, this
      # job only builds.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          # rust-cache keys include the job id and matrix values by
          # default, which would give every e2e shard (and the rust job)
          # its own disjoint cache. One explicit shared key makes them all
          # restore the same target/ cache.
          shared-key: api-target
      - run: yarn install --frozen-lockfile
      # Build the API binary in its own step, BEFORE Playwright runs: the
      # per-worker e2e-api.sh build is a ~0.2s no-op once the release
      # binary is fresh, but a cold compile takes minutes and would blow
      # the apiPort fixture's 30s setup timeout (exactly what happened on
      # the first sharded CI run).
      - run: cargo build --release --manifest-path api/Cargo.toml --bin nightlio-api
      # No python needed anywhere: PDF export renders in-process in the
      # Rust binary (markdown2pdf crate, contract/DECISIONS.md #15).
      - run: yarn playwright install --with-deps chromium
      # Shards split by spec file (fullyParallel is false), so each shard
      # runs ~a quarter of the spec files with its own 4 workers.
      - run: yarn test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
